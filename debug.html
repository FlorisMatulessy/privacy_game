<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/react-app/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Privacy Quest - Debug</title>
    <style>
      #error-display {
        position: fixed;
        top: 10px;
        right: 10px;
        background: #ff4444;
        color: white;
        padding: 20px;
        border-radius: 8px;
        max-width: 500px;
        display: none;
        z-index: 10000;
        font-family: monospace;
        font-size: 12px;
        max-height: 80vh;
        overflow: auto;
      }
    </style>
    <link rel="stylesheet" crossorigin href="/react-app/assets/index.css">
  </head>
  <body>
    <div id="error-display"></div>
    <div id="root"></div>
    
    <script>
      window.addEventListener('error', function(e) {
        const errorDiv = document.getElementById('error-display');
        errorDiv.style.display = 'block';
        errorDiv.innerHTML += '<strong>ERROR:</strong><br>' + e.message + '<br>' + e.filename + ':' + e.lineno + '<br><br>';
        console.error('Global error:', e);
      });
      
      window.addEventListener('unhandledrejection', function(e) {
        const errorDiv = document.getElementById('error-display');
        errorDiv.style.display = 'block';
        errorDiv.innerHTML += '<strong>PROMISE ERROR:</strong><br>' + e.reason + '<br><br>';
        console.error('Unhandled rejection:', e);
      });
    </script>
    
    <script type="module" crossorigin src="/react-app/assets/index.js"></script>
  </body>
</html>
