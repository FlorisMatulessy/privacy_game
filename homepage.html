<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Quest - Welcome</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .landing-logo {
            margin-bottom: 2rem;
        }
        .landing-logo img {
            max-width: 300px;
            height: auto;
        }
        .landing-title {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }
        .landing-subtitle {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: var(--text-muted);
        }
        .enter-app-btn {
            padding: 1.5rem 3rem;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        .enter-app-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .redirect-message {
            margin-top: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
    <script>
        // Auto-redirect to React app after 3 seconds
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
    </script>
</head>
<body>
    <div class="landing-container">
        <div class="landing-logo">
            <img src="images/logo.png" alt="Privacy Quest Logo">
        </div>
        <h1 class="landing-title">Privacy Quest</h1>
        <p class="landing-subtitle">Leer over privacy door middel van games</p>
        <a href="/" class="enter-app-btn">Start de App</a>
        <p class="redirect-message">Je wordt automatisch doorgestuurd naar de app...</p>
    </div>
</body>
</html>
