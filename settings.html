<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
<header>
    <div class="logo">
        <a href="homepage.html">
            <img src="images/logo.png" alt="Logo">
        </a>
    </div>
    <button class="btn"><a href="leaderboard.html">Leaderboard</a></button>
    <button class="btn"><a href="accounts.html">Account</a></button>
    <button class="btn"><a href="uitloggen.html">Uitloggen</a></button>
</header>
<div class="container">

    <!-- Welcome -->
    <h1 class="welcome">Instellingen</h1>

    <!-- Settings content -->
    <div class="settings-content">
        <div class="settings-section">
            <h2>Audio</h2>
            <div class="setting-item">
                <label for="sound-toggle">Geluid Aanzetten</label>
                <input type="checkbox" id="sound-toggle" checked>
            </div>
            <div class="setting-item">
                <label for="volume">Volume</label>
                <input type="range" id="volume" min="0" max="100" value="75">
            </div>
        </div>

        <div class="settings-section">
            <h2>Uiterlijk</h2>
            <div class="setting-item">
                <label for="theme-select">Thema</label>
                <select id="theme-select">
                    <option value="light">Licht</option>
                    <option value="dark">Donker</option>
                    <option value="auto">Auto</option>
                </select>
            </div>
        </div>

        <div class="settings-section">
            <div class="setting-item">
                <button class="btn save-settings">Instellingen Opslaan</button>
            </div>
        </div>
    </div>

</div>
</body>
</html>
